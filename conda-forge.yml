github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
  pkg_format: '2'
conda_forge_output_validation: true
workflow_settings:
  store_build_artifacts:
    - platform:
        - linux_64
        - linux_aarch64
 #       - linux_ppc64le
        - osx_64
        - osx_arm64
        - win_64
      value: true
noarch_platforms:
  - linux_64
  - win_64
  - osx_64
  - osx_arm64
#  - linux_ppc64le
  - linux_aarch64
provider:
  osx_arm64: default
  linux_aarch64: default
#  linux_ppc64le: default
test: native_and_emulated
bot:
  automerge: true
  inspection: update-grayskull
  check_solvable: true
  run_deps_from_wheel: true
conda_install_tool: pixi
conda_build_tool: rattler-build
shellcheck:
  enabled: true
